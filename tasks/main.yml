---
# Tasks adapted from upstream victoriametrics.cluster.vmagent role configure.yml

- name: Configure promscrape config
  ansible.builtin.template:
    src: promscrape.yml.j2
    dest: "{{ vmagent_config_dir }}/config.yml"
    owner: "{{ vmagent_system_user }}"
    group: "{{ vmagent_system_group }}"
    mode: "0644"

- name: Create systemd drop-in directory
  ansible.builtin.file:
    path: "{{ vmagent_systemd_dropin_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure remote_write URL via systemd drop-in
  ansible.builtin.template:
    src: systemd_remote_write.conf.j2
    dest: "{{ vmagent_systemd_dropin_dir }}/remote_write.conf"
    owner: root
    group: root
    mode: "0644"
  register: _vmagent_dropin

- name: Create emit_vm configuration file
  ansible.builtin.template:
    src: emit_vm.conf.j2
    dest: /etc/emit_vm.conf
    owner: root
    group: root
    mode: "0644"

- name: Reload systemd # noqa no-handler
  ansible.builtin.systemd:
    daemon_reload: true
  when: _vmagent_dropin.changed

- name: Create x509-certificate-exporter config directory
  ansible.builtin.file:
    path: "{{ x509_certificate_exporter_config_dir }}"
    state: directory
    owner: "{{ x509_certificate_exporter_system_user }}"
    group: "{{ x509_certificate_exporter_system_group }}"
    mode: "0755"

- name: Configure x509-certificate-exporter (cert-expiry metrics)
  ansible.builtin.template:
    src: x509-certificate-exporter.yaml.j2
    dest: "{{ x509_certificate_exporter_config_dir }}/config.yaml"
    owner: "{{ x509_certificate_exporter_system_user }}"
    group: "{{ x509_certificate_exporter_system_group }}"
    mode: "0644"
  register: _x509_exporter_config

- name: Enable and (re)start x509-certificate-exporter # noqa no-handler
  ansible.builtin.systemd:
    name: "{{ x509_certificate_exporter_service_name }}"
    enabled: true
    state: "{{ 'restarted' if _x509_exporter_config.changed else 'started' }}"
