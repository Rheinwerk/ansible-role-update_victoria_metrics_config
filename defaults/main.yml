---
# Defaults aligned with upstream victoriametrics.cluster.vmagent role

vmagent_system_user: "vic_vm_agent"
vmagent_system_group: "{{ vmagent_system_user }}"

vmagent_config_dir: "/opt/vic-vmagent"

vmagent_systemd_service_name: "vic-vmagent"
vmagent_systemd_dropin_dir: "/etc/systemd/system/{{ vmagent_systemd_service_name }}.service.d"

# Remote write labels - added to all metrics sent via remote write
# These use CD_ENV variables from /etc/ansible/group_vars/all.yml
vmagent_remote_write_labels:
  env: "{{ CD_ENV.iaas.env | default('unknown') }}"
  account: "{{ CD_ENV.iaas.account | default('unknown') }}"
  region: "{{ CD_ENV.iaas.region | default('unknown') }}"
  hostgroup: "{{ CD_ENV.instance.hostgroup | default('unknown') }}"
  hostname: "{{ ansible_hostname }}"

# Default scrape config - scrapes local node_exporter with FQDN as instance label
# Override this in ASP if you need different scrape targets
vmagent_scrape_config:
  scrape_configs:
    - job_name: node_exporter
      static_configs:
        - targets:
            - "127.0.0.1:9100"
          labels:
            instance: "{{ ansible_fqdn }}"

# x509-certificate-exporter (cert-expiry metrics). The exporter
# binary/systemd unit are expected to already be installed (disabled) by
# the baseimage -- this role only (re)renders its config and starts it,
# once /etc/cert_exp_time_globs has its final per-service content.
x509_certificate_exporter_system_user: "x509_certificate_exporter"
x509_certificate_exporter_system_group: "{{ x509_certificate_exporter_system_user }}"
x509_certificate_exporter_service_name: "x509-certificate-exporter"
x509_certificate_exporter_config_dir: "/etc/x509-certificate-exporter"
x509_certificate_exporter_listen_address: "127.0.0.1:9793"
x509_certificate_exporter_refresh_interval: "1h"

# Glob patterns (one per line, '#'-comments and blank lines ignored) of
# cert files to watch. '*.properties' entries are skipped -- those wrap
# a PKCS#12 path + passphrase (e.g. APNS certs) which this exporter can't
# parse directly from a Java properties file.
x509_certificate_exporter_cert_glob_file: "/etc/cert_exp_time_globs"
